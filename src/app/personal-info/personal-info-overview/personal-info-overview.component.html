<form (submit)="apply()">
  <div class="form-group row">
    <mat-form-field class="example-container">
      <input matInput placeholder="First Name" [formField]="personalInfoForm.firstName" />
      @if (personalInfoForm.firstName().invalid() && personalInfoForm.firstName().touched()) {
        <mat-error>First name is <strong>required</strong></mat-error>
      }
    </mat-form-field>
  </div>
  <div class="form-group row">
    <mat-form-field class="example-container">
      <input matInput placeholder="Last Name" [formField]="personalInfoForm.lastName" />
      @if (personalInfoForm.lastName().invalid() && personalInfoForm.lastName().touched()) {
        <mat-error>Last name is <strong>required</strong></mat-error>
      }
    </mat-form-field>
  </div>

  <!-- Address Field exercise: mount your component here, e.g. -->
  <!-- <app-address [formField]="personalInfoForm.address" /> -->

  <div class="form-group row">
    <button mat-raised-button color="primary" type="submit">Apply</button>
  </div>
</form>
